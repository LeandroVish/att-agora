<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <main>
        <section class="captcha">
            <div>
                <h1>
                    Captcha Color
                    <span id="placar">0/15</span>
                </h1>
                <p>00:00</p>
            </div>
            <ul>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
            </ul>
            <h2>CLIQUE NA COR: <span></span></h2>
        </section>

        <section class="bemvindo">
            <h1 class="resultado"></h1>
            <button onclick="reiniciar()">recomeçar</button>
        </section>
    </main>
    <style>
        * {
            margin: 0;
            padding: 0;
            border: none;
            list-style: none;
            box-sizing: border-box;
        }

        body {
            background: #111;
        }

        #placar {
            display: block;
            font-size: 1rem;
            color: #aaa;
            margin-top: 5px;
        }

        section {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            width: 50vw;
            margin: 5vw auto;
            background: black;
            color: white;
            padding: 20px;
            border-radius: 10px;
        }

        section div {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        section div h1 {
            font-size: 2rem;
        }

        section div p {
            font-size: 2rem;
            color: rgb(163, 255, 25);
        }

        section ul {
            display: grid;
            grid-template-columns: 10fr 10fr 10fr;
            gap: 10px;
            width: 30vw;
            margin: 20px auto;
        }

        section ul li {
            height: 10vw;
            background-color: green;
        }
        section.bemvindo {
            display: none;
            text-align: center;
        }
        section.bemvindo button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #3498db;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        h2 {
            text-align: center;
            font-size: 1.5rem;
        }
        section ul li:hover {
            transform: scale(1.05);
        }
    </style>
    <script>
        const itens = document.querySelectorAll('li');

        const somacertos = new Audio('victory.mp3');
        const somerros = new Audio('error.mp3');

        const colors = [
            { name: "AZUL", value: "#3498db" },
            { name: "VERDE", value: "#1abc9c" },
            { name: "ROXO", value: "#9b59b6" },
            { name: "LARANJA", value: "#e67e22" },
            { name: "VERMELHO", value: "#e74c3c" },
            { name: "CINZA", value: "#34495e" }
        ];

        let acertos = parseInt(localStorage.getItem('acertos')) || 0;

        document.querySelector('h1 span').innerText = `${acertos}/15`;

        console.log(colors[0].name);

        for (let i = 0; i < itens.length; i++) {
            itens[i].addEventListener('click', function () {
                const corSpan = document.querySelector('h2 > span').textContent;

                if (itens[i].dataset.nomecor === corSpan) {
                    console.log('Acertou');
                    embaralharCores();
                    sorteio();
                    acertos =  acertos + 1;
                    localStorage.setItem('acertos', acertos);
                    document.querySelector('h1 span').innerText = `${acertos}/15`;
                    somacertos.play();
                    if (acertos >= 15) {
                        clearInterval(intervalo);
                        document.querySelector('.resultado').textContent = `Parabéns! Você completou o desafio em ${cronometro}`;
                        document.querySelector('.captcha').style.display = 'none';
                        document.querySelector('.bemvindo').style.display = 'block';
                    }
                } else {
                    console.log('Errou');
                    somerros.play();
                }
            });

            itens[i].style.backgroundColor = colors[i].value;
            itens[i].dataset.nomecor = colors[i].name;
        }

        console.log(parseInt(Math.random() * 6));

        function sorteio() {
            let indice = parseInt(Math.random() * 6);
            let cor = colors[indice];

            const span = document.querySelector('h2 > span');
            span.textContent = cor.name;

            let indice_cor = parseInt(Math.random() * 6);

            span.style.color = colors[indice_cor].value;
        }

        const inicio = Date.now();
        intervalo = setInterval(() => {
            let agora = Date.now();
            let ms = agora - inicio;

            cronometro = new Date(ms).toString().substr(19, 5);

            if (ms >= 20000) {
                clearInterval(intervalo);
                document.querySelector('.captcha').style.display = 'none';
                document.querySelector('.bemvindo').style.display = 'block';
                document.querySelector('.resultado').textContent = `Tempo esgotado! Você completou ${acertos} acertos em ${cronometro}`;
            }
            console.log(cronometro);
            let p = document.querySelector('div p');
            p.innerText = cronometro;
        }, 1000);

        sorteio()

        function embaralharCores() {
            colors.sort(() => Math.random() - 0.5);
            for (let i = 0; i < itens.length; i++) {
                itens[i].style.backgroundColor = colors[i].value;
                itens[i].dataset.nomecor = colors[i].name;
            }
        }
        function reiniciar() {
            localStorage.setItem('acertos', 0);
            location.reload();
        }
    </script>
</body>

</html>
