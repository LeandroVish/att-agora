<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }

        body {
            background-color: #ececec;
            display: flex;
            justify-content: center;
            padding-top: 40px;
        }

        section {
            width: 700px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 40px;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input {
            flex: 1;
            padding: 15px;
            border: none;
            outline: none;
            font-size: 18px;
            background-color: #f5f5f5;
            border-radius: 5px;
        }

        button {
            padding: 15px 25px;
            border: none;
            background-color: #4b7bec;
            color: white;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #3867d6;
        }

        ul {
            list-style: none;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
        }

        .left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .acoes {
            display: flex;
            gap: 15px;
        }

        .delete {
            color: red;
            cursor: pointer;
        }

        .edit {
            color: #4b7bec;
            cursor: pointer;
        }
    </style>

</head>

<body>

    <section>

        <h1>To Do List</h1>

        <div class="container">

            <form>
                <input type="text" placeholder="Add new task">
                <button type="button">Add</button>
            </form>

            <ul></ul>

        </div>

    </section>

    <script>

        let button = document.querySelector('button');

        button.addEventListener('click', adicionarTarefa);

        function adicionarTarefa() {
            let campo = document.querySelector('input');
            if (campo.value == '') {
                alert('Digite uma tarefa');
                return;
            }

            let li = document.createElement('li');

            li.innerHTML = `
      
        <div class="left">
          <input type="checkbox" onchange="concluir(this)">
          <span>${campo.value}</span>
        </div>

        <div class="acoes">
          <span class="delete" onclick="remover(this)">Delete</span>
          <span class="edit" onclick="editar(this)">Edit</span>
        </div>

      `;

            document.querySelector('ul').appendChild(li);
            campo.value = '';
            campo.focus();
        }

        function remover(elemento) {
            elemento.closest('li').remove();
        }

        function concluir(elemento) {
            let texto = elemento.parentElement.querySelector('span');
            texto.classList.toggle('completed');
        }

        function editar(elemento) {
            let span = elemento
                .closest('li')
                .querySelector('.left span');
            let novoTexto = prompt('Editar tarefa:', span.innerText);
            if (novoTexto != null && novoTexto != '') {
                span.innerText = novoTexto;
            }
        }
    </script>

</body>

</html>
